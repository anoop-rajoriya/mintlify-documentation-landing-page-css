<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/favicon.svg" type="image/x-icon" />
    <title>Mintlify - The documentation platform for agents</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="container head">
        <a href="/" class="brand-logo">
          <img src="./assets/icons/mintlify-logo.svg" alt="Mintlify Home" />
        </a>
        <nav class="desktop-view">
          <ul>
            <li>
              <a href="#" class="link"
                >Products <i class="bi bi-chevron-down"></i
              ></a>
            </li>
            <li>
              <a href="#" class="link"
                >Solutions <i class="bi bi-chevron-down"></i
              ></a>
            </li>
            <li>
              <a href="#" class="link"
                >Resources <i class="bi bi-chevron-down"></i
              ></a>
            </li>
            <li>
              <a href="#" class="link">Prices </a>
            </li>
          </ul>
        </nav>
        <div class="actions">
          <button class="btn-signin outline desktop-view">Sign in</button
          ><button class="btn-contact primary desktop-view">
            Contact sales
          </button>
          <div class="btn-navigation mobile-view">
            <svg
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3 6h14M3 10h14M3 14h14"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              ></path>
            </svg>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="container hero">
        <div class="content">
          <div class="badge">
            <span class="label">Agent traffic</span>
            <span class="value"
              >77.8545% <i class="bi bi-chevron-right"></i
            ></span>
          </div>
          <h1 class="title">The intelligent documentation platform</h1>
          <p class="sub-title">
            Self-updating documentation for <span>startups</span>,
            <span>enterprises</span>, and <span>agents</span>.
          </p>
          <div class="actions">
            <button class="btn-started">
              Get started <i class="bi bi-chevron-right"></i>
            </button>
            <button class="btn-google-signup">
              <svg
                viewBox="0 0 16 16"
                class="size-4"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill="#4285F4"
                  d="M15.68 8.18c0-.57-.05-1.11-.15-1.64H8v3.1h4.3a3.68 3.68 0 0 1-1.6 2.42v2h2.59c1.51-1.4 2.39-3.45 2.39-5.88Z"
                ></path>
                <path
                  fill="#34A853"
                  d="M8 16c2.16 0 3.97-.72 5.29-1.94l-2.59-2c-.72.48-1.63.77-2.7.77-2.08 0-3.84-1.4-4.47-3.29H.86v2.07A8 8 0 0 0 8 16Z"
                ></path>
                <path
                  fill="#FBBC05"
                  d="M3.53 9.54a4.8 4.8 0 0 1 0-3.07V4.4H.86a8 8 0 0 0 0 7.2l2.67-2.06Z"
                ></path>
                <path
                  fill="#EA4335"
                  d="M8 3.18c1.17 0 2.23.4 3.06 1.2l2.29-2.3A8 8 0 0 0 .86 4.4l2.67 2.07C4.16 4.58 5.92 3.18 8 3.18Z"
                ></path>
              </svg>
              Sign up with Google
            </button>
          </div>
        </div>
        <div class="media">
          <img
            src="./assets/images/hero-preview.svg"
            alt="Preview hero image"
          />
        </div>
      </section>
    </main>
    <footer>
      <div class="container"></div>
    </footer>
  </body>
</html>
